title: Jeremy Lebow

# Description of your website. This is used for social sharing.
description:  I am an economist at the World Bank’s Social Policy Global Practice.

# A brief blurb about yourself
content: My name is Jeremy Lebow and I am an economist at the World Bank’s <a href="https://www.worldbank.org/ext/en/topic/social-policy" target="_blank" rel="noopener noreferrer">Social Policy Global Practice</a>, with previous experience in the <a href="https://www.worldbank.org/en/topic/poverty" target="_blank" rel="noopener noreferrer">Poverty & Equity Practice</a> for Africa East. I hold a Ph.D. and M.A. in Economics from Duke University. My research and policy work lie at the intersection of development, labor, and migration economics, with an emphasis on how migration, skills, and labor market institutions shape employment and economic opportunity. I also teach International Migration and Development at the <a href="https://sfs.georgetown.edu/ma-international-migration-refugees/" target="_blank" rel="noopener noreferrer">Georgetown Master of Arts in International Migration and Refugees</a>.

