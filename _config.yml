description:  I am an economist at the World Bank’s Social Protection & Jobs Global Practice.

# A brief blurb about yourself
content: My name is Jeremy Lebow and I am an economist at the World Bank’s Social Protection & Jobs Global Practice, with previous experience in the Poverty & Equity Practice for Africa East. I hold a Ph.D. and M.A. in Economics from Duke University. My research and policy work lie at the intersection of development, labor, and migration economics, with an emphasis on the economic and social effects of large migration flows and the causes and consequences of gender inequality in developing countries. <br>
Previously, I worked as a research associate at the Abdul Latif Jameel Poverty Action Lab and as a data analyst at Innovations for Poverty Action.

